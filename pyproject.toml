[project]
name = "pallas-growth-team"
version = "0.1.0"
description = "An always-on AI growth team for Meta ads, built on Meta's Muse models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pydantic-ai-slim[openai]>=2.63.0",
    "pillow>=13.0.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pgt = "pgt.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Comparison bench: arm C uses the OpenAI Agents SDK (as does the Day 1 spike), arm D LangGraph.
bench = [
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "openai-agents>=0.24.0",
]
spike = ["httpx>=0.28.1", "openai-agents>=0.24.0"]

[tool.uv]
default-groups = ["dev", "bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
