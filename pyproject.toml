[project]
name = "pallas-growth-team"
version = "0.1.0"
description = "An always-on AI growth team for Meta ads, built on Meta's Muse models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.scripts]
pgt = "pgt.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
